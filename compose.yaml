name: jagood-coldchain

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-route_planner}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-route_planner}"
      POSTGRES_DB: "${POSTGRES_DB:-route_planner}"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-route_planner} -d ${POSTGRES_DB:-route_planner}"]
      interval: 5s
      timeout: 5s
      retries: 10

  route-planner:
    build:
      context: ./services/ai/route-planner
    restart: unless-stopped
    init: true
    environment:
      ORS_API_KEY: "${ORS_API_KEY:-}"
      BMKG_BASE_URL: "${BMKG_BASE_URL:-https://peta-maritim.bmkg.go.id/public_api}"
      BMKG_CACHE_TTL_SECONDS: "${BMKG_CACHE_TTL_SECONDS:-10800}"
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-route_planner}:${POSTGRES_PASSWORD:-route_planner}@postgres:5432/${POSTGRES_DB:-route_planner}"
    ports:
      - "${ROUTE_PLANNER_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 5

  planner-web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:${ROUTE_PLANNER_PORT:-8000}"
    restart: unless-stopped
    environment:
      AI_EXPLAIN_API_BASE_URL: "http://ai-explain:8000"
    ports:
      - "${PLANNER_WEB_PORT:-3000}:3000"
    depends_on:
      route-planner:
        condition: service_healthy
      ai-explain:
        condition: service_healthy

  # Ollama itself runs natively on the host (not containerized): Docker Desktop/OrbStack on
  # macOS run Linux containers inside a VM with no access to Metal, so a containerized Ollama
  # is CPU-only and far too slow for interactive chat. Run `brew install ollama && brew services
  # start ollama && ollama pull ${OLLAMA_MODEL}` on the host first; ai-explain below reaches it
  # through host.docker.internal. On a Linux host with an NVIDIA GPU, swap this back to a
  # containerized `ollama/ollama:latest` service with GPU passthrough instead.
  ai-explain:
    build:
      context: ./services/ai/ai-explain
    restart: unless-stopped
    init: true
    environment:
      AI_EXPLAIN_LLM_BASE_URL: http://host.docker.internal:11434/v1
      AI_EXPLAIN_LLM_API_KEY: ""
      AI_EXPLAIN_LLM_MODEL: "${OLLAMA_MODEL:-qwen3:4b-instruct}"
      AI_EXPLAIN_LLM_TIMEOUT_SECONDS: "300"
      AI_EXPLAIN_LLM_TEMPERATURE: "0.2"
      AI_EXPLAIN_KNOWLEDGE_DIR: /home/app/knowledge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${AI_EXPLAIN_PORT:-8001}:8000"
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ./apps/jagood-web
    restart: unless-stopped
    ports:
      - "${JAGOOD_WEB_PORT:-3001}:80"
    depends_on:
      ai-explain:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  postgres-data:
