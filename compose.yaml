name: jagood-coldchain

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_CONTEXT_LENGTH: "2048"
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_MAX_QUEUE: "64"
      OLLAMA_NUM_PARALLEL: "1"
    expose:
      - "11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ollama-model-init:
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-qwen3:4b-instruct}"]
    depends_on:
      ollama:
        condition: service_healthy

  ai-explain:
    build:
      context: ./services/ai/ai-explain
    restart: unless-stopped
    init: true
    environment:
      AI_EXPLAIN_LLM_BASE_URL: http://ollama:11434/v1
      AI_EXPLAIN_LLM_API_KEY: ""
      AI_EXPLAIN_LLM_MODEL: "${OLLAMA_MODEL:-qwen3:4b-instruct}"
      AI_EXPLAIN_LLM_TIMEOUT_SECONDS: "300"
      AI_EXPLAIN_LLM_TEMPERATURE: "0.2"
      AI_EXPLAIN_KNOWLEDGE_DIR: /home/app/knowledge
    ports:
      - "${AI_EXPLAIN_PORT:-8000}:8000"
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ./apps/jagood-web
    restart: unless-stopped
    ports:
      - "${JAGOOD_WEB_PORT:-3000}:80"
    depends_on:
      ai-explain:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  ollama-models:
