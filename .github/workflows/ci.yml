name: CI

on:
  push:
    branches: ["main", "integration/**", "feat/**"]
  pull_request:

jobs:
  ai-explain-tests:
    name: ai-explain / pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai/ai-explain
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/ai/ai-explain/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest

  route-planner-tests:
    name: route-planner / pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai/route-planner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/ai/route-planner/requirements-dev.txt

      # xgboost's Linux wheel dynamically links libgomp (OpenMP); ubuntu-latest normally
      # ships it already, but this makes the dependency explicit instead of relying on
      # whatever happens to already be on the runner image.
      - name: Install libgomp
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  route-planner-training-smoke-test:
    name: route-planner / training pipeline smoke test
    runs-on: ubuntu-latest
    needs: route-planner-tests
    defaults:
      run:
        working-directory: services/ai/route-planner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/ai/route-planner/requirements.txt

      - name: Install libgomp
        run: sudo apt-get update && sudo apt-get install -y libgomp1

      - name: Install
        run: pip install -r requirements.txt

      # Regenerates data + retrains + re-evaluates end to end, entirely offline (no DB,
      # no ORS/BMKG API keys needed). Catches the class of bug we hit manually: model
      # input columns drifting out of sync with what callers (or business-logic scripts)
      # actually pass in. Does not fail the build on metric regressions by itself --
      # evaluate_model.py already asserts recall_High >= 0.80 and exits non-zero if not.
      - name: Regenerate synthetic data
        run: |
          python -m training.synthetic_corridors
          python -m training.generate_synthetic_data
      - name: Train model
        run: python -m training.train_model
      - name: Evaluate model
        run: python -m training.evaluate_model
