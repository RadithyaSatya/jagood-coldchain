[pytest]
pythonpath = .
testpaths = tests
# --record-mode=none: VCR-marked tests may only replay committed cassettes, never touch
# live network -- keeps CI (and everyone's local runs) free of flakiness/rate limits/API
# keys. To re-record after intentionally changing a VCR-marked test, run e.g.:
#   pytest tests/test_predict_route_e2e.py --record-mode=once
addopts = -q --record-mode=none
