# Optional override: runs Ollama in a container instead of on the host.
#
# The default compose.yaml expects Ollama running natively on the host (see the comment
# there) so it can use GPU acceleration (Metal on macOS, CUDA/ROCm on Linux with the right
# Docker runtime configured). That's not always available -- e.g. a judge/reviewer who just
# wants to `docker compose up` without installing Ollama separately, a CI runner, or a Linux
# host where you've wired up NVIDIA Container Toolkit GPU passthrough for Docker instead of
# running Ollama on the host. Use this override in those cases:
#
#   docker compose -f compose.yaml -f compose.ollama-container.yml up --build
#
# Trade-off: on macOS this container gets no GPU access (Docker Desktop/OrbStack run Linux
# containers inside a VM with no Metal passthrough), so Ollama falls back to CPU-only
# inference -- workable for smoke-testing the chat endpoint, too slow for interactive use.
# On a Linux host with NVIDIA Container Toolkit set up, uncomment the `deploy.resources`
# block below to pass the GPU through and get comparable speed to the native-host path.

services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_CONTEXT_LENGTH: "2048"
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_MAX_QUEUE: "64"
      OLLAMA_NUM_PARALLEL: "1"
    expose:
      - "11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    # Uncomment on a Linux host with NVIDIA Container Toolkit installed:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  ollama-model-init:
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-qwen3:1.7b}"]
    depends_on:
      ollama:
        condition: service_healthy

  ai-explain:
    environment:
      AI_EXPLAIN_LLM_BASE_URL: http://ollama:11434/v1
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully

volumes:
  ollama-models:
